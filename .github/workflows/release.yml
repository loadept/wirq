name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-github-release:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: linux_64
            platform: 'linux/amd64'
            os: ubuntu-latest
          - name: win_64
            platform: 'windows/amd64'
            os: windows-latest
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install wails and go modules
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go mod download

      - name: Install and build frontend
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build

      - name: Install Linux dependencies
        if: startsWith(matrix.build.platform, 'linux')
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows NSIS
        if: startsWith(matrix.build.platform, 'windows')
        shell: bash
        run: |
          choco install nsis -y
          NSIS_BIN="/c/Program Files (x86)/NSIS/Bin"
          if [ ! -f "$NSIS_BIN/makensis.exe" ]; then echo "ERROR: makensis.exe not found at $NSIS_BIN"; exit 1; fi
          echo "makensis: $NSIS_BIN/makensis.exe"

      - name: Build
        shell: bash
        run: |
          PLATFORM="${{ matrix.build.platform }}"

          if [[ "$PLATFORM" == windows/* ]]; then
            export PATH="/c/Program Files (x86)/NSIS/Bin:$PATH"
          fi
          echo "PATH=$PATH"

          BUILD_ARGS="-platform $PLATFORM -trimpath -ldflags \"-s -w -X main.Version=${{ github.ref_name }}\" -skipbindings"

          if [[ "$PLATFORM" == windows/* ]]; then
            BUILD_ARGS="$BUILD_ARGS -nsis"
          fi

          if [ "${PLATFORM%/*}" = "linux" ]; then
            BUILD_ARGS="$BUILD_ARGS -tags webkit2_41"
          fi

          echo "BUILD_ARGS=$BUILD_ARGS"
          wails build $BUILD_ARGS
          ls -l build/bin/
