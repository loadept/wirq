name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: linux_64
            platform: 'linux/amd64'
            os: ubuntu-latest
          - name: win_64
            platform: 'windows/amd64'
            os: windows-latest
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install and build frontend
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build

      - name: Install Linux dependencies
        if: startsWith(matrix.build.platform, 'linux')
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows dependencies
        if: startsWith(matrix.build.platform, 'windows')
        shell: bash
        run: |
          choco install nsis -y
          NSIS_BIN="/c/Program Files (x86)/NSIS/Bin"
          if [ ! -f "$NSIS_BIN/makensis.exe" ]; then echo "ERROR: makensis.exe not found at $NSIS_BIN"; exit 1; fi
          echo "makensis: $NSIS_BIN/makensis.exe"

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "VERSION=dev-${SHORT}" >> $GITHUB_ENV
          fi

      - name: Build
        shell: bash
        run: |
          PLATFORM="${{ matrix.build.platform }}"

          if [[ "$PLATFORM" == windows/* ]]; then
            export PATH="/c/Program Files (x86)/NSIS/Bin:$PATH"
          fi

          BUILD_ARGS="-platform $PLATFORM -trimpath -ldflags \"-s -w -X main.Version=${{ env.VERSION }}\" -skipbindings"

          if [[ "$PLATFORM" == windows/* ]]; then
            BUILD_ARGS="$BUILD_ARGS -nsis"
          fi

          if [ "${PLATFORM%/*}" = "linux" ]; then
            BUILD_ARGS="$BUILD_ARGS -tags webkit2_41"
          fi

          echo "Compile with flags [$BUILD_ARGS]"
          eval wails build $BUILD_ARGS

      - name: Package Linux binary
        if: startsWith(matrix.build.platform, 'linux')
        run: |
          cd build/bin
          chmod +x wirq
          tar --remove-files -czvf wirq-linux-amd64.tar.gz wirq
          sha256sum wirq-linux-amd64.tar.gz > checksums-linux.txt

      - name: Package Windows binary
        if: startsWith(matrix.build.platform, 'windows')
        run: |
          cd build/bin
          mv wirq.exe wirq-portable.exe
          sha256sum wirq-portable.exe wirq-amd64-installer.exe > checksums-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.build.name }}
          path: build/bin/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "$VERSION" \
            wirq-linux-amd64.tar.gz \
            checksums-linux.txt \
            checksums-windows.txt \
            wirq-portable.exe \
            wirq-amd64-installer.exe \
            --title "wirq proxy $VERSION" \
            --generate-notes
